# The hosted demo stack. On the VPS: `docker compose pull && docker compose up -d` with deploy/.env beside this file.
# Locally or in CI, add docker-compose.build.yml to build the images instead of pulling them.

name: skillcert

services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillcert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: skillcert
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillcert -d skillcert"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    image: ghcr.io/${GHCR_OWNER:-brad82}/skillcert-migrator:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      ConnectionStrings__skillcert: Host=postgres;Database=skillcert;Username=skillcert;Password=${POSTGRES_PASSWORD}
      Seed__DemoUsers: ${SEED_DEMO_USERS:-true}
      Seed__DemoPassword: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      TZ: ${TZ:-America/Denver}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/${GHCR_OWNER:-brad82}/skillcert-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__skillcert: Host=postgres;Database=skillcert;Username=skillcert;Password=${POSTGRES_PASSWORD}
      S3__ServiceUrl: ${S3_SERVICE_URL:-}
      S3__AccessKey: ${S3_ACCESS_KEY:-}
      S3__SecretKey: ${S3_SECRET_KEY:-}
      S3__Bucket: ${S3_BUCKET:-}
      # The org timezone (development plan §1.5): nightly run time, dates on screen and in PDFs.
      TZ: ${TZ:-America/Denver}
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    image: ghcr.io/${GHCR_OWNER:-brad82}/skillcert-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
