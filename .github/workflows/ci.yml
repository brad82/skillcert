name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SkillCert.slnx

      - name: Build (warnings are errors)
        run: dotnet build SkillCert.slnx --no-restore --configuration Release

      # The build rewrites web/openapi/skillcert.json; a diff means an API change was committed without it.
      - name: OpenAPI spec is committed
        run: git diff --exit-code -- web/openapi/skillcert.json

      # Integration tests start Postgres with Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test SkillCert.slnx --no-build --configuration Release --logger "trx" --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: test-results

  web:
    name: Web typecheck, lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck (generates the API client and route tree first)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A diff means copy changed without running `npm run i18n:extract` (and filling fr.po).
      - name: Translation catalogs are up to date
        run: |
          npm run i18n:extract
          git diff --exit-code -- 'src/**/locales/*.po'

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright smoke tests against the compose stack
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env.ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # The same images the deploy workflow ships, built from this commit.
      - name: Start the stack
        run: |
          $COMPOSE up -d --build
          timeout 180 bash -c 'until [ "$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:8443/api/me)" = "401" ]; do sleep 2; done'

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run smoke tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://localhost:8443
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
