name: Deploy demo

# Runs only after CI has passed on main (or by hand). Images are built here and pushed to GHCR;
# the VPS pulls them. Only the compose file is copied to the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            file: deploy/dotnet.Dockerfile
            target: api
          - image: migrator
            file: deploy/dotnet.Dockerfile
            target: migrator
          - image: web
            file: web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skillcert-${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/${{ github.repository_owner }}/skillcert-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the demo VPS
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/skillcert' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IMAGE_TAG }}
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      # The host key is pinned from a secret rather than trusted on first use.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host demo
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Copy the compose file
        run: scp deploy/docker-compose.yml "demo:$DEPLOY_PATH/docker-compose.yml"

      - name: Pull and restart
        run: |
          ssh demo "set -euo pipefail
            cd '$DEPLOY_PATH'
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f"

      - name: Smoke check
        if: vars.DEMO_URL != ''
        run: |
          timeout 180 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.DEMO_URL }}/api/me")" = "401" ]; do sleep 5; done'
          curl -sf "${{ vars.DEMO_URL }}/login" > /dev/null
